[project]
name = "pixeltable-balloon-flight-ops"
version = "0.1.0"
description = "Hot-air balloon flight log CLI: idempotent batch imports keyed by content hashes, computed burn/propane/payload columns, pxt revert and pxt rename for recovery, and a fingerprint command that rebuilds the cloud deploy fingerprint with Pixeltable's public hashing helpers - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "computed-columns", "data-infrastructure", "balloon-flight-ops"]
dependencies = [
    "pixeltable>=0.7.19",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
